name: LocalPlayer
options:
  bundleIdPrefix: app.music
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  LocalPlayer:
    type: application
    platform: iOS
    sources:
      - LocalPlayer
    info:
      path: LocalPlayer/Info.plist
      properties:
        CFBundleDisplayName: LocalPlayer
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          gradle :composeApp:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.music.omishkdr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
          - "-framework"
          - "AVKit"
          - "-framework"
          - "UniformTypeIdentifiers"
